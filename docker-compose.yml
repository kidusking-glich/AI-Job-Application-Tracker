# Deploy: set DATABASE_URL, JWT_SECRET and GROQ_API_KEY in your environment
# (or a .env file next to this file). Never commit real secrets.
services:
  db:
    image: postgres:16-alpine
    container_name: job_tracker_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-job_tracker}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: job_tracker_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@db:5432/job_tracker?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-no-reply@yourdomain.com}
      MAILERSEND_FROM_NAME: ${MAILERSEND_FROM_NAME:-Contract Reader}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PORT: 3000
    depends_on:
      - db
    # Production: run the compiled app (the Dockerfile copies dist/).
    # For local dev with hot-reload, run the app outside Docker or override:
    # command: npm run start:dev  with  volumes: [".:/app", "/app/node_modules"]
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"

volumes:
  postgres_data:
