<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a100d"/>
      <stop offset="50%" stop-color="#0f1a14"/>
      <stop offset="100%" stop-color="#0a100d"/>
    </linearGradient>
    <linearGradient id="flag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009640"/>
      <stop offset="33%" stop-color="#009640"/>
      <stop offset="33%" stop-color="#EFCD2E"/>
      <stop offset="66%" stop-color="#EFCD2E"/>
      <stop offset="66%" stop-color="#DA092F"/>
      <stop offset="100%" stop-color="#DA092F"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#009640" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#009640" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#DA092F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#DA092F" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Flag accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#flag)"/>

  <!-- Logo badge -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="96" height="96" rx="24" fill="url(#flag)"/>
  </g>
  <text x="128" y="140" text-anchor="middle" font-family="'Noto Sans Ethiopic', sans-serif" font-size="56" font-weight="bold" fill="#ffffff">ኢ</text>

  <!-- Title -->
  <text x="80" y="230" font-family="'Fraunces', Georgia, serif" font-size="64" font-weight="bold" fill="#ffffff">Ethiopian Contract Reader</text>
  <text x="80" y="280" font-family="'Noto Sans Ethiopic', 'Inter', sans-serif" font-size="36" fill="#9ca3af">የኮንትራት ተንታኝ · AI contract analysis</text>

  <!-- Divider -->
  <rect x="80" y="320" width="260" height="6" rx="3" fill="url(#flag)"/>

  <!-- Feature bullets -->
  <g font-family="'Inter', sans-serif" font-size="30" fill="#e5e7eb">
    <text x="80" y="390">🤖  AI-powered clause-by-clause risk analysis</text>
    <text x="80" y="450">🇬🇧  English &amp; Amharic (አማርኛ) support</text>
    <text x="80" y="510">📑  PDF, DOCX &amp; image OCR · free to use</text>
  </g>

  <!-- Right-side flag circle -->
  <circle cx="960" cy="420" r="130" fill="none" stroke="url(#flag)" stroke-width="16" opacity="0.85"/>
  <text x="960" y="445" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="44" font-weight="bold" fill="#ffffff">AI</text>

  <!-- Footer -->
  <rect x="0" y="600" width="1200" height="30" fill="#000000" fill-opacity="0.35"/>
  <text x="80" y="620" font-family="'Inter', sans-serif" font-size="20" fill="#6b7280">Understand every contract before you sign</text>
  <text x="1120" y="620" text-anchor="end" font-family="'Inter', sans-serif" font-size="20" fill="#6b7280">github.com/kidusking-glich</text>
</svg>
